<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sistema AR - Cambio de Escenas</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .status-indicator {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 999;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        .scene-button {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
        }
        .scene-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 999;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Indicador de estado -->
    <div id="statusIndicator" class="status-indicator">Esperando cámara...</div>
    
    <!-- Botón para cambiar de escena -->
    <button id="sceneButton" class="scene-button">Cambiar Escena</button>
    
    <!-- Indicador de escena actual -->
    <div id="sceneIndicator" class="scene-indicator">Escena 1: Cubo Rojo</div>
    
    <!-- Escena A-Frame -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;" vr-mode-ui="enabled: false">
        
        <!-- Marcador común para todas las escenas -->
        <a-marker id="miMarcador" type="pattern" url="zona1.patt" emitevents="true">
            <!-- Cubos de diferentes colores para diferentes escenas -->
            <a-box id="cuboEscena1" position="0 0.5 0" material="color: red; opacity: 0.8" scale="1 1 1" visible="true"></a-box>
            <a-box id="cuboEscena2" position="0 0.5 0" material="color: blue; opacity: 0.8" scale="1 1 1" visible="false"></a-box>
            <a-box id="cuboEscena3" position="0 0.5 0" material="color: green; opacity: 0.8" scale="1 1 1" visible="false"></a-box>
            <a-box id="cuboEscena4" position="0 0.5 0" material="color: yellow; opacity: 0.8" scale="1 1 1" visible="false"></a-box>
        </a-marker>
        
        <!-- Cámara -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        // Referencias a elementos DOM
        const statusIndicator = document.getElementById('statusIndicator');
        const marker = document.getElementById('miMarcador');
        const sceneButton = document.getElementById('sceneButton');
        const sceneIndicator = document.getElementById('sceneIndicator');
        
        // Configuración de escenas
        const escenas = [
            { id: 'cuboEscena1', color: 'Rojo', nombre: 'Escena 1' },
            { id: 'cuboEscena2', color: 'Azul', nombre: 'Escena 2' },
            { id: 'cuboEscena3', color: 'Verde', nombre: 'Escena 3' },
            { id: 'cuboEscena4', color: 'Amarillo', nombre: 'Escena 4' }
        ];
        
        let escenaActual = 0;
        
        // Actualizar cuando la cámara esté lista
        document.querySelector('a-scene').addEventListener('loaded', () => {
            statusIndicator.textContent = 'Cámara activa - Buscando marcador...';
        });
        
        // Detectar cuando se encuentra el marcador
        marker.addEventListener('markerFound', () => {
            statusIndicator.textContent = '¡MARCADOR DETECTADO!';
        });
        
        // Detectar cuando se pierde el marcador
        marker.addEventListener('markerLost', () => {
            statusIndicator.textContent = 'Marcador perdido - Buscando...';
        });
        
        // Función para cambiar de escena
        function cambiarEscena() {
            // Ocultar todos los cubos
            escenas.forEach(escena => {
                document.getElementById(escena.id).setAttribute('visible', 'false');
            });
            
            // Avanzar a la siguiente escena
            escenaActual = (escenaActual + 1) % escenas.length;
            
            // Mostrar el cubo de la escena actual
            document.getElementById(escenas[escenaActual].id).setAttribute('visible', 'true');
            
            // Actualizar el indicador de escena
            sceneIndicator.textContent = `${escenas[escenaActual].nombre}: Cubo ${escenas[escenaActual].color}`;
        }
        
        // Asignar el evento al botón
        sceneButton.addEventListener('click', cambiarEscena);
    </script>
</body>
</html>
