<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="buttons">
      <button onclick="switchScene('scene1')">Escena 1</button>
      <button onclick="switchScene('scene2')">Escena 2</button>
    </div>
    <a-scene id="scene1" 
             embedded
             arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <a-marker type="pattern" url="zona1.patt">
        <a-box position="0 0.5 0" 
               rotation="0 45 0" 
               color="red" 
               material="opacity: 0.9"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <a-scene id="scene2" 
             embedded
             arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
             style="display: none;">
      <a-marker type="pattern" url="zona22.patt">
        <a-box position="0 0.5 0" 
               rotation="0 45 0" 
               color="blue" 
               material="opacity: 0.9"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
