<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js con múltiples marcadores y botón de activación</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
      #startARButton {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 16px;
        z-index: 100;
        background-color: #008CBA;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #arScene {
        display: none;
      }
    </style>
  </head>
  <body>
    <button id="startARButton">Iniciar AR</button>

    <a-scene
      id="arScene"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Primer marcador -->
      <a-marker type="pattern" url="zona1.patt">
        <a-box position="0 0.5 0" material="color: red"></a-box>
      </a-marker>

      <!-- Segundo marcador -->
      <a-marker type="pattern" url="zona1.patt">
        <a-sphere position="0 0.5 0" radius="0.5" material="color: blue"></a-sphere>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const startButton = document.getElementById("startARButton");
      const arScene = document.getElementById("arScene");

      startButton.addEventListener("click", () => {
        arScene.style.display = "block";
        startButton.style.display = "none";
      });
    </script>
  </body>
</html>
