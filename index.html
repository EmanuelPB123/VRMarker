<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sistema AR Simple - Un Solo Marcador</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .status-indicator {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 999;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Indicador de estado movido a la parte inferior para no obstruir la vista -->
    <div id="statusIndicator" class="status-indicator">Esperando cámara...</div>
    
    <!-- Escena A-Frame simplificada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;" vr-mode-ui="enabled: false">
        
        <!-- Un solo marcador -->
        <a-marker id="miMarcador" type="pattern" url="markers/patron.patt" emitevents="true">
            <!-- Un cubo simple -->
            <a-box position="0 0.5 0" material="color: red; opacity: 0.8" scale="1 1 1"></a-box>
        </a-marker>
        
        <!-- Cámara con mirada -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        // Referencias a elementos DOM
        const statusIndicator = document.getElementById('statusIndicator');
        const marker = document.getElementById('miMarcador');
        
        // Actualizar cuando la cámara esté lista
        document.querySelector('a-scene').addEventListener('loaded', () => {
            statusIndicator.textContent = 'Cámara activa - Buscando marcador...';
        });
        
        // Detectar cuando se encuentra el marcador
        marker.addEventListener('markerFound', () => {
            statusIndicator.textContent = '¡MARCADOR DETECTADO!';
            console.log('Marcador encontrado');
        });
        
        // Detectar cuando se pierde el marcador
        marker.addEventListener('markerLost', () => {
            statusIndicator.textContent = 'Marcador perdido - Buscando...';
            console.log('Marcador perdido');
        });
    </script>
</body>
</html>
