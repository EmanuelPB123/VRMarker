<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.2.1/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- Cámara -->
      <a-marker type="pattern" url="tumarcador.patt" id="mimarcador">
        <!-- Entidad que desaparecerá -->
        <a-box id="miCaja" position="0 0.5 0" color="tomato"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Espera a que la escena esté lista
      document.addEventListener('DOMContentLoaded', () => {
        const caja = document.querySelector('#miCaja');

        // Esperar 5 segundos (por ejemplo)
        setTimeout(() => {
          caja.setAttribute('scale', '0 0 0');
        }, 5000); // 5000 ms = 5 segundos
      });
    </script>
  </body>
</html>
