<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sistema AR Simple - Cambio de Cubos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        .button-container {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 999;
        }
        .scene-button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            padding: 10px 15px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        .active-button {
            background: rgba(76, 175, 80, 0.8);
        }
        .status-indicator {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 999;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Indicador de estado -->
    <div id="statusIndicator" class="status-indicator">Buscando marcador...</div>
    
    <!-- Botones para cambiar escenas -->
    <div class="button-container">
        <button id="cubo1Button" class="scene-button active-button">Cubo Rojo</button>
        <button id="cubo2Button" class="scene-button">Cubo Azul</button>
    </div>
    
    <!-- Una sola escena A-Frame -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
        
        <!-- Un solo marcador con múltiples cubos -->
        <a-marker id="miMarcador" type="pattern" url="zona1.patt" raycaster="objects: .clickable" emitevents="true">
            <!-- Cubo 1: Rojo -->
            <a-box id="cubo1" position="0 0.5 0" rotation="0 0 0" scale="1 1 1" material="color: red; opacity: 0.8" visible="true"></a-box>
            
            <!-- Cubo 2: Azul -->
            <a-box id="cubo2" position="0 0.5 0" rotation="0 0 0" scale="1 1 1" material="color: blue; opacity: 0.8" visible="false"></a-box>
        </a-marker>
        
        <!-- Cámara con cursor -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        // Referencias a elementos DOM
        const statusIndicator = document.getElementById('statusIndicator');
        const marker = document.getElementById('miMarcador');
        const cubo1Button = document.getElementById('cubo1Button');
        const cubo2Button = document.getElementById('cubo2Button');
        const cubo1 = document.getElementById('cubo1');
        const cubo2 = document.getElementById('cubo2');
        
        // Configuración de cubos
        const cubos = [
            { element: cubo1, button: cubo1Button, color: 'Rojo' },
            { element: cubo2, button: cubo2Button, color: 'Azul' }
        ];
        
        let cuboActualIndex = 0;
        
        // Función para cambiar entre cubos
        function cambiarACubo(index) {
            // Ocultar todos los cubos
            cubos.forEach((cubo, i) => {
                cubo.element.setAttribute('visible', 'false');
                cubo.button.classList.remove('active-button');
            });
            
            // Mostrar el cubo seleccionado
            cuboActualIndex = index;
            cubos[cuboActualIndex].element.setAttribute('visible', 'true');
            cubos[cuboActualIndex].button.classList.add('active-button');
            
            // Actualizar el indicador
            statusIndicator.textContent = `Mostrando: Cubo ${cubos[cuboActualIndex].color}`;
        }
        
        // Detectar cuando se encuentra el marcador
        marker.addEventListener('markerFound', () => {
            statusIndicator.textContent = `Marcador detectado - Cubo ${cubos[cuboActualIndex].color}`;
        });
        
        // Detectar cuando se pierde el marcador
        marker.addEventListener('markerLost', () => {
            statusIndicator.textContent = `Buscando marcador... (Cubo ${cubos[cuboActualIndex].color})`;
        });
        
        // Asignar eventos a los botones
        cubo1Button.addEventListener('click', () => cambiarACubo(0));
        cubo2Button.addEventListener('click', () => cambiarACubo(1));
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            // Empezar con el primer cubo
            cambiarACubo(0);
        });
    </script>
</body>
</html>
