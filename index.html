<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sistema AR con Imágenes - Responsive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        .button-container {
            position: fixed;
            bottom: 4vh;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 3vw;
            z-index: 999;
        }
        .scene-button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            padding: 2vh 3vw;
            font-size: clamp(14px, 4vw, 18px);
            border-radius: 5px;
            cursor: pointer;
            min-width: 20vw;
            max-width: 40vw;
            text-align: center;
        }
        .active-button {
            background: rgba(76, 175, 80, 0.8);
        }
        .status-indicator {
            position: fixed;
            top: 2vh;
            left: 2vw;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1vh 2vw;
            border-radius: 5px;
            z-index: 999;
            font-family: Arial, sans-serif;
            font-size: clamp(12px, 3.5vw, 16px);
            width: auto;
            max-width: 80vw;
            text-align: center;
        }
        
        /* Media queries para diferentes dispositivos */
        @media (max-width: 480px) {
            .scene-button {
                padding: 1.5vh 3vw;
            }
            .button-container {
                bottom: 2vh;
                left: 5px
            }
        }
        
        @media (min-width: 768px) {
            .scene-button {
                max-width: 200px;
                font-size: 18px;
            }
            .status-indicator {
                font-size: 16px;
                max-width: 500px;
            }
        }
    </style>
</head>
<body>
    <!-- Indicador de estado -->
    <div id="statusIndicator" class="status-indicator">Buscando marcador...</div>
    
    <!-- Botones para cambiar escenas -->
    <div class="button-container">
        <button id="imagen1Button" class="scene-button active-button">Imagen 1</button>
        <button id="imagen2Button" class="scene-button">Imagen 2</button>
    </div>
    
    <!-- Una sola escena A-Frame -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
        <!-- Definir assets para las imágenes -->
        <a-assets>
            <!-- Reemplaza estas URLs con las URLs de tus imágenes -->
            <img id="img1" src="/api/placeholder/400/320" alt="Imagen 1">
            <img id="img2" src="/api/placeholder/400/320" alt="Imagen 2">
        </a-assets>
        
        <!-- Un solo marcador con múltiples imágenes -->
        <a-marker id="miMarcador" type="pattern" url="zona1.patt" raycaster="objects: .clickable" emitevents="true">
            <!-- Imagen 1 -->
            <a-plane id="imagen1" position="0 0 0" rotation="-90 0 0" width="2" height="2" material="src: #img1; transparent: true; opacity: 1" visible="true"></a-plane>
            
            <!-- Imagen 2 -->
            <a-plane id="imagen2" position="0 0 0" rotation="-90 0 0" width="2" height="2" material="src: #img2; transparent: true; opacity: 1" visible="false"></a-plane>
        </a-marker>
        
        <!-- Cámara con cursor -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        // Referencias a elementos DOM
        const statusIndicator = document.getElementById('statusIndicator');
        const marker = document.getElementById('miMarcador');
        const imagen1Button = document.getElementById('imagen1Button');
        const imagen2Button = document.getElementById('imagen2Button');
        const imagen1 = document.getElementById('imagen1');
        const imagen2 = document.getElementById('imagen2');
        
        // Configuración de imágenes
        const imagenes = [
            { element: imagen1, button: imagen1Button, nombre: 'Imagen 1' },
            { element: imagen2, button: imagen2Button, nombre: 'Imagen 2' }
        ];
        
        let imagenActualIndex = 0;
        
        // Función para cambiar entre imágenes
        function cambiarAImagen(index) {
            // Ocultar todas las imágenes
            imagenes.forEach((imagen, i) => {
                imagen.element.setAttribute('visible', 'false');
                imagen.button.classList.remove('active-button');
            });
            
            // Mostrar la imagen seleccionada
            imagenActualIndex = index;
            imagenes[imagenActualIndex].element.setAttribute('visible', 'true');
            imagenes[imagenActualIndex].button.classList.add('active-button');
            
            // Actualizar el indicador
            statusIndicator.textContent = `Mostrando: ${imagenes[imagenActualIndex].nombre}`;
        }
        
        // Detectar cuando se encuentra el marcador
        marker.addEventListener('markerFound', () => {
            statusIndicator.textContent = `Marcador detectado - ${imagenes[imagenActualIndex].nombre}`;
        });
        
        // Detectar cuando se pierde el marcador
        marker.addEventListener('markerLost', () => {
            statusIndicator.textContent = `Buscando marcador... (${imagenes[imagenActualIndex].nombre})`;
        });
        
        // Asignar eventos a los botones
        imagen1Button.addEventListener('click', () => cambiarAImagen(0));
        imagen2Button.addEventListener('click', () => cambiarAImagen(1));
        
        // Adaptación dinámica al tamaño de pantalla
        function ajustarInterfaz() {
            // Ajustar altura de botones en dispositivos muy pequeños
            if (window.innerHeight < 400) {
                document.querySelector('.button-container').style.bottom = '10px';
            }
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            // Empezar con la primera imagen
            cambiarAImagen(0);
            // Ajustar interfaz según el tamaño de pantalla
            ajustarInterfaz();
        });
        
        // Reajustar interfaz cuando cambie el tamaño de la ventana
        window.addEventListener('resize', ajustarInterfaz);
    </script>
</body>
</html>
