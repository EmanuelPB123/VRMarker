<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Cubos activados por QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.3.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/AR.js/2.2.2/aframe-ar.js"></script>
    <script>
        // Componente personalizado para manejar la visibilidad de los cubos
        AFRAME.registerComponent('qr-detector', {
            init: function () {
                // Obtener referencias a los cubos
                this.cubo1 = document.querySelector('#cubo1');
                this.cubo2 = document.querySelector('#cubo2');
                this.cubo3 = document.querySelector('#cubo3');
                
                // Inicializar todos los cubos como invisibles
                this.cubo1.setAttribute('scale', '0 0 0');
                this.cubo2.setAttribute('scale', '0 0 0');
                this.cubo3.setAttribute('scale', '0 0 0');
                
                // Configurar eventos para cada marcador
                let marker1 = document.querySelector('#marker1');
                let marker2 = document.querySelector('#marker2');
                let marker3 = document.querySelector('#marker3');
                
                // Eventos para el marcador 1
                marker1.addEventListener('markerFound', () => {
                    this.cubo1.setAttribute('scale', '1 1 1');
                    console.log('Marcador 1 encontrado, mostrando cubo 1');
                });
                
                marker1.addEventListener('markerLost', () => {
                    this.cubo1.setAttribute('scale', '0 0 0');
                    console.log('Marcador 1 perdido, ocultando cubo 1');
                });
                
                // Eventos para el marcador 2
                marker2.addEventListener('markerFound', () => {
                    this.cubo2.setAttribute('scale', '1 1 1');
                    console.log('Marcador 2 encontrado, mostrando cubo 2');
                });
                
                marker2.addEventListener('markerLost', () => {
                    this.cubo2.setAttribute('scale', '0 0 0');
                    console.log('Marcador 2 perdido, ocultando cubo 2');
                });
                
                // Eventos para el marcador 3
                marker3.addEventListener('markerFound', () => {
                    this.cubo3.setAttribute('scale', '1 1 1');
                    console.log('Marcador 3 encontrado, mostrando cubo 3');
                });
                
                marker3.addEventListener('markerLost', () => {
                    this.cubo3.setAttribute('scale', '0 0 0');
                    console.log('Marcador 3 perdido, ocultando cubo 3');
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" qr-detector>
        <!-- Cámara con cursor -->
        <a-entity camera>
            <a-cursor></a-cursor>
        </a-entity>
        
        <!-- Marcadores -->
        <a-marker id="marker1" type="pattern" url="zona1.patt">
            <!-- Cubo 1 - inicialmente invisible, se mostrará al detectar marker1 -->
            <a-box id="cubo1" position="0 0.5 0" color="red" scale="0 0 0"></a-box>
        </a-marker>
        
        <a-marker id="marker2" type="pattern" url="zona2.patt">
            <!-- Cubo 2 - inicialmente invisible, se mostrará al detectar marker2 -->
            <a-box id="cubo2" position="0 0.5 0" color="green" scale="0 0 0"></a-box>
        </a-marker>
        
        <a-marker id="marker3" type="pattern" url="zona3.patt">
            <!-- Cubo 3 - inicialmente invisible, se mostrará al detectar marker3 -->
            <a-box id="cubo3" position="0 0.5 0" color="blue" scale="0 0 0"></a-box>
        </a-marker>
    </a-scene>
</body>
</html>
